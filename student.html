<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Диктант</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="brand"><span class="dot">●</span> Диктант</div>
  </div>

  <div id="view-setup" class="card" style="display:none;">
    <h1>Сайт ещё не настроен</h1>
    <p>Попросите вашего учителя завершить настройку сайта.</p>
  </div>

  <div id="view-join" class="card narrow" style="display:none;">
    <h1>Присоединиться к игре</h1>
    <div id="join-error" class="error-banner" style="display:none;"></div>
    <div class="field">
      <label>Код игры</label>
      <input type="text" id="join-code" maxlength="6" style="text-transform:uppercase; letter-spacing:0.15em; font-weight:700; font-size:20px; text-align:center;">
    </div>
    <div class="field">
      <label>Твоё имя</label>
      <input type="text" id="join-name" placeholder="Имя и фамилия">
    </div>
    <button class="btn block" id="join-btn">Начать</button>
  </div>

  <div id="view-waiting" class="card narrow center" style="display:none;">
    <h1 id="waiting-title"></h1>
    <div class="spinner"></div>
    <p class="muted">Учитель скоро начнёт игру. Не закрывай страницу.</p>
  </div>

  <div id="view-dictation" class="card center" style="display:none;">
    <div class="sentence-progress" id="sentence-progress"></div>

    <div id="answer-panel">
      <p class="muted" style="margin-bottom:2px;">Переведи на английский:</p>
      <div class="prompt-word" id="prompt-word"></div>
      <input type="text" id="current-answer" class="answer-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Напиши перевод…">
      <button class="btn success block" id="submit-answer-btn" style="margin-top:12px;">Ответить ✓</button>
    </div>
    <div id="waiting-panel" style="display:none; padding:20px 0;">
      <div class="spinner"></div>
      <p class="muted">Ответ отправлен ✓ Ждём остальных…</p>
    </div>
  </div>

  <div id="view-round-result" class="card center" style="display:none;">
    <h1>Слово <span id="round-result-num"></span></h1>
    <div class="result-icon" id="round-result-icon"></div>
    <div class="score-badge" id="round-points-badge"></div>
    <p class="muted" id="round-points-note"></p>
    <p style="font-size:18px; font-weight:700;" id="round-correct-answer"></p>
    <button class="btn secondary" id="round-listen-btn" style="margin:6px auto 0;">🔊 Прослушать</button>
    <div class="divider"></div>
    <p class="muted" id="round-rank-note"></p>
    <p class="muted">Учитель скоро продолжит игру…</p>
    <div class="spinner"></div>
  </div>

  <div id="view-results" class="card" style="display:none;">
    <h1>Результат</h1>
    <div class="score-badge" id="score-badge"></div>
    <p class="muted center" id="score-summary"></p>
    <p class="muted center" id="final-points-note"></p>
    <div class="divider"></div>
    <div id="results-list"></div>
  </div>

  <div class="footer-note" id="footer-code"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/common.js"></script>
<script src="js/student.js"></script>
</body>
</html>
